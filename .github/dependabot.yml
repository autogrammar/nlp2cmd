version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: cron
    cronjob: 45 4 * * *
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  versioning-strategy: increase-if-necessary
  allow:
  - dependency-name: costs
    dependency-type: all
  - dependency-name: env2llm
    dependency-type: all
  - dependency-name: goal
    dependency-type: all
  - dependency-name: nlp2cmd
    dependency-type: all
  - dependency-name: nlp2cmd-intent
    dependency-type: all
  - dependency-name: nlp2cmd-planner
    dependency-type: all
  - dependency-name: nlp2cmd-propact
    dependency-type: all
  - dependency-name: nlp2dsl-show
    dependency-type: all
  - dependency-name: nlp2uri
    dependency-type: all
  - dependency-name: pact-ir
    dependency-type: all
  - dependency-name: testql
    dependency-type: all
  - dependency-name: vql
    dependency-type: all
  groups:
    internal-packages:
      patterns:
      - costs
      - env2llm
      - goal
      - nlp2cmd
      - nlp2cmd-intent
      - nlp2cmd-planner
      - nlp2cmd-propact
      - nlp2dsl-show
      - nlp2uri
      - pact-ir
      - testql
      - vql
  commit-message:
    prefix: "chore(deps)"
