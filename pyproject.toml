[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlp2cmd"
version = "1.1.27"
description = "NLP2CMD - Transforms natural language into domain-specific commands (SQL, Shell, Docker, Kubernetes) using a multi-layered detection pipeline and thermodynamic optimization."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "NLP2CMD Team", email = "tom@sapletta.com" }
]
keywords = [
    "nlp",
    "natural-language-processing",
    "command-generation",
    "sql",
    "shell",
    "docker",
    "kubernetes",
    "dsl",
    "llm",
    "ai",
    "thermodynamic",
    "optimization",
    "langevin",
    "energy-models",
    "constraint-satisfaction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed"
]

dependencies = [
    "vql>=0.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.25.0",
    "jinja2>=3.0",
    "jsonschema>=4.0",
    "python-dotenv>=1.0",
    "watchdog>=3.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "rapidfuzz>=3.0",
    "nlp2cmd-intent>=0.1.2",
    "subactor-subllm @ git+https://github.com/subactor/subllm.git@40726bb9399eb5cf9dfc038c1c948b7d2fbdca3b",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
nlp = [
    "spacy>=3.7",
]
llm = [
    "anthropic>=0.18",
    "openai>=1.0",
    "litellm>=1.50.0",
]
router = [
    "litellm>=1.50.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]
sql = [
    "sqlparse>=0.4",
    "sqlalchemy>=2.0",
]
thermodynamic = [
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]
browser = [
    "playwright>=1.40.0",
    "testql>=1.2.64; python_version >= '3.11' and python_version < '3.14'",
]
testql = [
    "testql>=1.2.64; python_version >= '3.11' and python_version < '3.14'",
]
desktop = [
    "python-xlib>=0.33",
]
automation = [
    "httpx>=0.25.0",
    "pillow>=10.0",
    "playwright>=1.40.0",
]
llm-vision = [
    "httpx>=0.25.0",
    "pillow>=10.0",
]
vql = [
    "vql[png]>=0.1.0",
]
integration = [
    "pact-ir>=0.1.0",
    "nlp2cmd-planner>=0.1.0",
    "nlp2cmd-propact>=0.1.0",
    "nlp2dsl-show>=0.1.0",
]
uri = [
    "nlp2uri>=0.4",
    "env2llm>=0.1.3",
]
mcp = [
    "nlp2uri>=0.4",
    "env2llm>=0.1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.0",
    "pytest-mock>=3.10",
    "playwright>=1.40.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
    "mkdocstrings[python]>=0.24",
]
all = [
    "nlp2cmd[nlp,llm,router,sql,thermodynamic,browser,vql,integration,dev]",
]

[project.scripts]
nlp2cmd = "nlp2cmd.cli.main:cli_entry_point"
nlp2cmd-mcp = "nlp2cmd.mcp.server:main"
app2schema = "app2schema.cli:main"
nlp2cmd-setup = "scripts.setup_external:main"
nlp2cmd-install-desktop = "scripts.install_desktop_tools:main"

[project.urls]
Homepage = "https://github.com/wronai/nlp2cmd"
Documentation = "https://nlp2cmd.readthedocs.io"
Repository = "https://github.com/wronai/nlp2cmd"
Issues = "https://github.com/wronai/nlp2cmd/issues"
Changelog = "https://github.com/wronai/nlp2cmd/blob/main/CHANGELOG.md"

[tool.uv.sources]
vql = { path = "../../oqlos/vql", editable = true }
# Sibling monorepo packages (../nlp2dsl). Publish to PyPI for standalone installs.
nlp2cmd-intent = { path = "../nlp2dsl/packages/nlp2cmd-intent", editable = true }
pact-ir = { path = "../nlp2dsl/packages/pact-ir", editable = true }
nlp2cmd-planner = { path = "../nlp2dsl/packages/nlp2cmd-planner", editable = true }
nlp2cmd-propact = { path = "../nlp2dsl/packages/nlp2cmd-propact", editable = true }
nlp2dsl-show = { path = "../nlp2dsl/packages/nlp2dsl-show", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nlp2cmd", "src/app2schema"]
include = [
    "src/nlp2cmd/data/*.json",
    "src/nlp2cmd/data/*.yaml",
    "src/nlp2cmd/data/*.yml",
    "src/nlp2cmd/data/intract-bindings.json",
    "src/nlp2cmd/data/intract-policy.json",
]

[tool.hatch.build]
include = [
    "src/nlp2cmd/data/*.json",
    "src/nlp2cmd/data/*.yaml",
    "src/nlp2cmd/data/*.yml",
    "src/nlp2cmd/data/intract-bindings.json",
    "src/nlp2cmd/data/intract-policy.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
]
exclude = [
    "/data",
    "/artifacts",
    "/benchmark_output",
    "/demo_results",
    "/generated",
    "/project",
    "/screenshots",
    "/test_screenshots",
    "/web_generated",
    "**/*.mp4",
    "**/*.webm",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hatch
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/nlp2cmd"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/deep/deep-v4-pro"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/deep/deep-v4-pro"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
